# Render Blueprint for the Django API. The React app is deployed separately on Vercel.
services:
  - type: web
    name: truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # One process keeps the in-memory cache and rate limits shared; threads cover the
    # I/O-bound waits on HERE and Open-Meteo.
    startCommand: .venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: HERE_API_KEY
        sync: false
